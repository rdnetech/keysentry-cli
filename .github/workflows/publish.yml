# Publishes @keysentry/cli to npm when a version tag (v1.2.3) is pushed.
# Uses npm trusted publishing (OIDC): no npm token is stored anywhere.
# Provenance is attached automatically (public repo + public package).
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write   # required for trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Use npm 11.5.1 or later (trusted publishing needs it)
        run: npm install -g npm@^11.5.1
      - name: Tag must match package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG"; exit 1
          fi
      - name: Syntax check
        run: node --check bin/keysentry.mjs && node --check lib/sso.mjs
      - name: Publish
        run: npm publish --access public
